[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quack"
dynamic = ["version"]
description = "Quantification Kit for Python"
readme = "README.md"
# `X | Y` type annotations are evaluated at runtime in several public
# signatures (e.g. quack.visualization), so 3.10 is a hard floor.
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Gilberto Medeiros", email = "medeiros.gilberto.br@gmail.com" }
]
keywords = ["quantification", "prevalence-estimation", "dataset-shift", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds are the oldest releases the test suite is verified against
# (see the "minimum-dependencies" job in .github/workflows/tests.yaml).
# Keeping them low matters for a library: an unnecessarily high floor forces
# a dependency upgrade on every downstream project that installs quack.
dependencies = [
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pandas>=2.1",
    "numpy>=1.26",
    "cvxpy>=1.4",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/jose-gilberto/quack"
Documentation = "https://jose-gilberto.github.io/quack/"
Repository = "https://github.com/jose-gilberto/quack"
Issues = "https://github.com/jose-gilberto/quack/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-shadcn",
    "mkdocstrings[python]>=0.24.0",
    "Pygments"
]
viz = [
    "matplotlib>=3.8",
]

[tool.setuptools.dynamic]
version = { attr = "quack.core.__VERSION__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quack = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=quack --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "src/quack/datasets/_uci_datasets.py",
    "src/quack/datasets/_forman_datasets.py",
    "src/quack/datasets/_reviews_datasets.py",
    "src/quack/datasets/_physionet_datasets.py",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
