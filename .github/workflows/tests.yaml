name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test,viz]

    - name: Run tests with coverage
      run: |
        pytest

  minimum-dependencies:
    # Guards the lower bounds declared in pyproject.toml: without this job
    # they are an untested promise, and downstream users hitting an older
    # numpy/scikit-learn would be the ones to discover it.
    name: Oldest supported dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip

    - name: Install pinned lower bounds
      run: |
        python -m pip install --upgrade pip
        pip install "scikit-learn==1.4.*" "scipy==1.11.*" "pandas==2.1.*" \
                    "numpy==1.26.*" "cvxpy==1.4.*" "tqdm==4.66.*" "matplotlib==3.8.*"
        pip install --no-deps .
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest
